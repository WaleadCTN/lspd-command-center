<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LSPD Command Center</title>
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>
<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="badge">LSPD</div>
    <div class="eyebrow">LOS SANTOS POLICE DEPARTMENT</div>
    <h1>Command Center</h1>
    <p class="muted">Training • Personnel • Operations</p>
    <form id="loginForm">
      <label class="field"><span>Adresse e-mail</span><input id="loginEmail" type="email" required autocomplete="username"></label>
      <label class="field"><span>Mot de passe</span><input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <button class="btn full" type="submit">Se connecter</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</section>

<div id="appShell" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="badge small">LSPD</div>
      <div><b>Command Center</b><small>Training & Operations</small></div>
    </div>
    <nav id="nav">
      <button data-page="dashboard" class="active">🏠 Dashboard</button>
      <button data-page="manual">📚 Manuel FTO</button>
      <button data-page="modules">🎓 Formations</button>
      <button data-page="evaluations">✅ Évaluations</button>
      <button data-page="trainees">🧭 Mes recrues</button>
      <button data-page="officers">👮 Officiers</button>
      <button data-page="assignments">🔗 Affectations FTO</button>
      <button data-page="certifications">🏅 Certifications</button>
      <button data-page="records">📁 Dossiers & distinctions</button>
      <button data-page="shifts">🕒 Roster & shifts</button>
      <button data-page="leave">🌴 Congés</button>
      <button data-page="calendar">🗓️ Calendrier formations</button>
      <button data-page="promotionAdvisor">🤖 Promotion advisor</button>
      <button data-page="promotions">⬆️ Promotions</button>
      <button data-page="stats">📈 Statistiques</button>
      <button data-page="grades">⭐ Grades & responsabilités</button>
      <button data-page="scenarios">🎯 Scénarios</button>
      <button data-page="admin">⚙️ Admin</button>
      <button data-page="history">📊 Historique</button>
    </nav>
    <div class="side-footer">
      <span id="currentUser">Déconnecté</span><br>
      <button id="logoutBtn" class="logout">Se déconnecter</button>
    </div>
  </aside>

  <main class="main">
    <header>
      <div>
        <span class="eyebrow">LOS SANTOS POLICE DEPARTMENT</span>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="userpill" id="userPill">Compte LSPD</div>
    </header>
    <section id="content"></section>
  </main>
</div>

<script type="module" src="app.js?v=6.0"></script>
</body>
</html>
